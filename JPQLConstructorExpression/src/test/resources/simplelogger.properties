# Configuration for the slf4j-simple test logger
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# Hibernate logs SQL statements via hibernate.show_sql in persistence.xml.
# Set the following to debug/trace to see bind parameters instead.
org.slf4j.simpleLogger.log.org.hibernate.SQL=info
org.slf4j.simpleLogger.log.org.hibernate.orm.jdbc.bind=info
